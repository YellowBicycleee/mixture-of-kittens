[build-system]
requires = ["setuptools>=80", "torch>=2.10.0,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "mixture-of-kittens"
version = "0.1.0"
description = "Mixture-of-Kittens: MoE Megakernel for NVL72s"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["torch>=2.10.0,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
cutedsl = ["nvidia-cutlass-dsl[cu13]==4.6.2"]

[tool.setuptools.packages.find]
include = ["mok*"]

[tool.uv]
no-build-isolation = true
